# market structure configuration file

# generic simulation parameters
sim_time: 300  # steps per day
days: 3 # default 1 day, starting with id=0
lob_plot_interval: 25
debug_logging: False
seed: 67

# definitions of the securities
markets:
  security_1:
    name: "Simple stock market as underlying"
    instrument_class: stock # stock is default :)
    ticker: "TNT"
    market_type: continuous
    lam: 0.8 # does this have any effect? It's defined in each agent though
    agent_groups:
      noise:
        agent_class: NoiseAgent
        number: 15
        config:
          lam: 0.1
          q_max: 1000
          mean_volume: 15
          mean_spread: 0.8
      mmzoh_1:
        agent_class: MMZOHAgent
        number: 1
        config:
          xi: 0.12
          K: 3
          omega: 0.1
          rebalance_period: 20
          volume: 60

  ########################## second security ###################################################

  security_2:
    name: "First derivative - European CALL option on stock TNT with strike 100"
    instrument_class: option
    derivatives_config:
      option_type: European
      underlying: security_1  # reference to one of above defined securities
      expiration: 247   # at first set 1Y as default, but should be a date/ hour, end of particular session, etc
      strike: 100 # maybe list of strikes?
      option_side: CALL # CALL/ PUT, TODO: well, we could make it prepare the whole surface here?
      quotation_type: price # price/ implied_volatility/ etc.
      settlement_type: cash # cash/ physical/ etc
    ticker: "O100Y092027ABB"
    market_type: continuous
    lam: 0.8 # does this have any effect? It's defined in each agent though
    agent_groups:
      noise:
        agent_class: NoiseAgent
        number: 15
        config:
          lam: 0.1
          q_max: 1000
          mean_volume: 15
          mean_spread: 0.8
      mmzoh_1:
        agent_class: OptionMMZOHAgent
        number: 1
        config:
          xi: 0.12
          K: 3
          omega: 0.1
          rebalance_period: 20
          volume: 60
