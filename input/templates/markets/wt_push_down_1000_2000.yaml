name: "WashTraders pushing down 1002-2000"
ticker: "ACC"
market_type: continuous
lam: 0.8 # does this have any effect? It's defined in each agent though
agent_groups:
  noise: !include ../agents/noise_15_agents_rather_lazy.yaml
  noise_2: !include ../agents/noise_25_agents_withdrawing.yaml
  mmzoh_1: !include ../agents/MM_rebalance_23_vol_60.yaml

  # manipulators:
  poolA:
    agent_class: WashTradingAgent
    number: 1
    config:
#      lam: 0.05 # activation factor outside manipulation periods - should behave like ZI
      q_max: 8000
#      manipulation_boundaries:
      manipulation_type: PUSH_DOWN #PULL_UP
      manipulation_side: BUY
#        manipulation_period:
      manipulation_period_start: 1002
      manipulation_period_end: 2000
      lam: 0.99
      spread: 0.00  # it affects rebalance (strongly!)
  poolB:
    agent_class: WashTradingAgent
    number: 1
    config:
#      lam: 0.05 # activation factor outside manipulation periods - should behave like ZI
      q_max: 8000
#      manipulation_boundaries:
      manipulation_type: PUSH_DOWN #PULL_UP
      manipulation_side: SELL
#        manipulation_period: # could be more than 1 period
      manipulation_period_start: 1002
      manipulation_period_end: 2000
      lam: 0.99
      spread: 0.00 # 0.1 seems like too small one, 0.4 seems to work fine but beware the other side!

# the dependencies
agent_dependencies:
  - type: wash_trading_pool
    buy_pool: poolA
    sell_pool: poolB
