name: "WashTraders pulling up 1000-1500"
ticker: "AAA"
market_type: continuous
lam: 0.8 # does this have any effect? It's defined in each agent though
agent_groups:
  noise: !include ../agents/noise_25_agents_rather_lazy.yaml
  mmzoh_1: !include ../agents/MM_rebalance_20_vol_60.yaml
  # manipulators:
  poolA:
    agent_class: WashTradingAgent
    number: 1
    config:
#      lam: 0.1 # activation factor outside manipulation periods - should behave like ZI
      q_max: 2000
#      manipulation_boundaries:
      manipulation_type: PULL_UP #PUSH_DOWN #PULL_UP
      manipulation_side: BUY
#      manipulation_period:
      manipulation_period_start: 1002
      manipulation_period_end: 1500
      lam: 0.99
      spread: 0.00 # check this - it highly affects rebalancing, 0.5 was probably too high
  poolB:
    agent_class: WashTradingAgent
    number: 1
    config:
#      lam: 0.1 # activation factor outside manipulation periods - should behave like ZI
      q_max: 2000
#      manipulation_boundaries:
      manipulation_type: PULL_UP #PUSH_DOWN #PULL_UP
      manipulation_side: SELL
#        manipulation_period: # could be more than 1 period
      manipulation_period_start: 1002
      manipulation_period_end: 1500
      lam: 0.99
      spread: 0.00 # 0.1 seems like too small one, 0.4 seems to work fine but beware the other side!
# the dependencies
agent_dependencies:
  - type: wash_trading_pool
    buy_pool: poolA
    sell_pool: poolB