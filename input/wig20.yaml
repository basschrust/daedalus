# Main and authoritative WIG20 configuration

dataset: wig20

days: 110
sim_time: 55
seed: 67
lob_plot_interval: 10000

lookback_sessions: 252
futures_count: 3
options_count: 20

# Reuse agent definitions through the existing loader
agents: !include templates/agents/wig20_agents.yaml

non_trading_dates:
  - '2026-11-11'
  - '2026-12-24'
  - '2026-12-25'
  - '2026-12-31'
  - '2027-01-01'
  - '2027-01-06'
  - '2027-03-26'
  - '2027-03-29'
  - '2027-05-03'

market_realism:
  enabled: true

risk_var:
  enabled: true
  lookback_sessions: 250
  confidence_levels: [0.95, 0.99]
  horizons_days: [1, 5, 10]
  historical_min_scenarios: 30
  montecarlo_scenarios: 10000
  montecarlo_seed: 67

# Post-run reporting using the existing 'python -m run.risk_report' command.
# This is a fixed synthetic index-unit portfolio, NOT historical agent positions.
risk_backtesting:
  enabled: true
  symbol: WIG20
  units: 20
  lookback_sessions: 125
  montecarlo_scenarios: 3000

risk_greeks:
  enabled: true
  calibration_id: YOUR_CALIBRATION_ID
  short_rates:
    PLN: 0.04
  dividend_yields:
    WIG20: 0.0
