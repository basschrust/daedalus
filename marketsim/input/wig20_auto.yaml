agents:
  noise_tight:
    agent_class: NoiseAgent
    instrument_classes:
    - stock
    - future
    number: 7
    config:
      lam: 0.4
      mean_volume: 150
      mean_spread: 0.3
      validity_period: 3
      volume_fraction: 0.009
      initial_cash:
        PLN: 1000000
  noise_medium:
    agent_class: NoiseAgent
    instrument_classes:
    - stock
    - future
    number: 10
    config:
      lam: 0.3
      mean_volume: 200
      mean_spread: 1.5
      validity_period: 10
      volume_fraction: 0.006
      initial_cash:
        PLN: 1000000
  noise_wide:
    agent_class: NoiseAgent
    number: 8
    config:
      lam: 0.2
      mean_volume: 250
      mean_spread: 4.0
      validity_period: 20
      volume_fraction: 0.0075
      initial_cash:
        PLN: 1000000
  market_makers:
    agent_class: MMZOHAgent
    instrument_classes:
    - stock
    - future
    number: 1
    config:
      rebalance_by: time
      rebalance_period: 4
      volume_fraction: 1
      K: 4
      xi: 0.1
      omega: 0.1
      q_max: 1000000
  momentum_fast:
    agent_class: MomentumAgent
    instrument_classes:
    - stock
    number: 2
    config:
      momentum_mode: intraday
      period: 5
      threshold: 0.001
      lam: 0.3
      mean_volume: 150
      q_max: 10000
      aggression: 0.0005
      volume_fraction: 0.005
      initial_cash:
        PLN: 10000000
  momentum_slow:
    agent_class: MomentumAgent
    instrument_classes:
    - stock
    number: 2
    config:
      momentum_mode: daily
      daily_lookback: 10
      threshold: 0.01
      lam: 0.2
      mean_volume: 150
      q_max: 5000
      aggression: 0.0005
      volume_fraction: 0.005
      initial_cash:
        PLN: 10000000
  hbl:
