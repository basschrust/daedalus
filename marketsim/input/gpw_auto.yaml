agents:
  relative_momentum:
    agent_class: RelativeMomentumAgent
    instrument_classes:
    - stock
    number: 20
    config:
      lookback_sessions: 252
      turnover_sessions: 30
      min_median_turnover: 250000
      portfolio_size: 10
      rebalance_sessions: 20
      aggression: 0.003
      order_validity_ticks: 3
      base_currency: PLN
      initial_cash:
        PLN: 1000000
  arbitrageurs:
    agent_class: IndexFuturesArbitrageAgent
    number: 5
    config:
      entry_threshold: 0.0015
      exit_threshold: 0.0004
      order_quantity: 25
      max_order_quantity: 100
      max_position: 500
      max_gross_exposure_pln: 100000000
      volume_aggression: 8.0
      max_stock_order_quantity: 10000
      validity_period: 1
      initial_cash:
        PLN: 100000000
  noise_tight:
    agent_class: NoiseAgent
    instrument_classes:
    - stock
    - future
    number: 7
    config:
      lam: 0.4
      mean_volume: 150
      mean_spread: 0.7
      validity_period: 3
      volume_fraction: 0.003
      use_historical_volatility: true
      historical_volatility_scale: 0.15
      volume_lookback: 20
      volatility_lookback: 20
      max_price_deviation: 0.02
      volume_basis: notional
      initial_cash:
        PLN: 1000000
  noise_medium:
    agent_class: NoiseAgent
    instrument_classes:
    - stock
    - future
    number: 10
    config:
      lam: 0.3
      mean_volume: 200
      mean_spread: 1.5
      validity_period: 10
      volume_fraction: 0.03
      historical_volatility_scale: 0.2
      max_price_deviation: 0.02
      volume_basis: notional
      initial_cash:
        PLN: 1000000
  noise_wide:
    agent_class: NoiseAgent
    number: 8
    config:
      lam: 0.2
      mean_volume: 250
      mean_spread: 4.0
      validity_period: 20
      volume_fraction: 0.003
      historical_volatility_scale: 0.15
      max_price_deviation: 0.02
      volume_basis: notional
      initial_cash:
        PLN: 1000000
  market_makers:
    agent_class: MMZOHAgent
    instrument_classes:
    - stock
    - future
    number: 1
    config:
      rebalance_by: time
      rebalance_period: 4
      volume_fraction: 0.02
      historical_volatility_scale: 0.7
      max_price_deviation: 0.04
      K: 4
      xi: 0.1
      omega: 0.1
      q_max: 1000000
  momentum_fast:
    agent_class: MomentumAgent
    instrument_classes:
    - stock
    number: 2
    config:
      momentum_mode: intraday
      period: 5
      threshold: 0.001
      lam: 0.3
      mean_volume: 150
      q_max: 10000
      aggression: 0.0005
      volume_fraction: 0.005
      historical_volatility_scale: 0.7
      max_price_deviation: 0.07
      initial_cash:
        PLN: 10000000
  momentum_slow:
    agent_class: MomentumAgent
    instrument_classes:
    - stock
    number: 2
    config:
      momentum_mode: daily
      daily_lookback: 10
      threshold: 0.01
      lam: 0.2
      mean_volume: 150
      q_max: 5000
      aggression: 0.0005
      volume_fraction: 0.005
      historical_volatility_scale: 0.7
      max_price_deviation: 0.09
      initial_cash:
        PLN: 10000000
