[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymarketsim"
version = "0.1.0"
description = "A Python framework for agent-based financial market simulation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"


authors = [
    { name = "Andrzej Kuropatwinski" }
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "mplfinance==0.12.10b0",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "loguru>=0.7",
    "torch>=2.2",
    "duckdb>=1.5.5",
]

[project.optional-dependencies]
plot = [
    "mplfinance==0.12.10b0",
]
snowflake = [
    "snowflake-connector-python[pandas]>=4",
]
dev = [
    "black",
    "pytest",
    "ruff",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["marketsim", "marketsim.*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",    # Import errors
    "E7",    # Statement errors
    "E9",    # Syntax errors
    "F",     # Pyflakes: unused imports, variables, undefined names
    "I",     # Import sorting (isort)
]

[tool.ruff.lint.isort]
combine-as-imports = true
